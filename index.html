<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AprilTag 36h11 3D Pose Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
      overflow: hidden;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video { display: none; }
    canvas {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(10, 10, 10, 0.88);
      backdrop-filter: blur(10px);
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 340px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hud h1 {
      font-size: 14px;
      margin-bottom: 6px;
      color: #00e676;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .controls {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 10, 0.88);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .controls label {
      font-size: 12px;
      color: #ccc;
    }
    .controls input {
      width: 60px;
      padding: 4px 6px;
      background: #222;
      border: 1px solid #555;
      color: #fff;
      border-radius: 4px;
      text-align: center;
    }
    .controls button {
      background: #00e676;
      border: none;
      color: #111;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .controls button:hover { background: #00c853; }
    #status { font-weight: bold; color: #fbc02d; }
    .value-row {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 12px;
    }
    .tag-block {
      margin-top: 8px;
      padding: 6px 8px;
      background: rgba(255, 255, 255, 0.06);
      border-left: 3px solid #00e676;
      border-radius: 4px;
    }
  </style>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body>

<div id="container">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="outputCanvas"></canvas>

  <div class="hud">
    <h1>AprilTag (36h11) 3D Tracker</h1>
    <div>Status: <span id="status">Loading OpenCV...</span></div>
    <div id="telemetry" style="margin-top: 8px; border-top: 1px solid #333; padding-top: 6px;">
      <i>Starting camera...</i>
    </div>
  </div>

  <div class="controls">
    <label for="tagSize">Tag Size (mm):</label>
    <input type="number" id="tagSize" value="100" min="10" max="1000" step="5">
    <button id="toggleCamera">Switch Cam</button>
  </div>
</div>

  function onOpenCvReady() {
    cv['onRuntimeInitialized'] = () => {
      openCvReady = true;
      statusText.innerText = "OpenCV Initialized";
      statusText.style.color = "#29b6f6";
      startCamera();
    };
  }

  async function startCamera() {
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: currentFacingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      await video.play();

      video.onloadedmetadata = () => {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;

        const w = canvas.width;
        const h = canvas.height;
        const focalLength = Math.max(w, h);

        if (cameraMatrix) cameraMatrix.delete();
        cameraMatrix = cv.matFromArray(3, 3, cv.CV_64F, [
          focalLength, 0, w / 2,
          0, focalLength, h / 2,
          0, 0, 1
        ]);

        if (distCoeffs) distCoeffs.delete();
        distCoeffs = cv.matFromArray(4, 1, cv.CV_64F, [0, 0, 0, 0]);

        if (srcMat) srcMat.delete();
        if (grayMat) grayMat.delete();
        if (threshMat) threshMat.delete();
        if (warpedMat) warpedMat.delete();
        if (dstQuadPts) dstQuadPts.delete();

        srcMat = new cv.Mat(h, w, cv.CV_8UC4);
        grayMat = new cv.Mat(h, w, cv.CV_8UC1);
        threshMat = new cv.Mat(h, w, cv.CV_8UC1);
        warpedMat = new cv.Mat(80, 80, cv.CV_8UC1);

        // Canonical 80x80 quadrilateral coordinates

          0, 0,
          79, 0,
          79, 79,
          0, 79
        ]);

        statusText.innerText = "Tracking Active (36h11)";
        statusText.style.color = "#00e676";

        if (!isLoopRunning) {
          isLoopRunning = true;
          requestAnimationFrame(processFrame);
        }
      };
    } catch (err) {
      statusText.innerText = "Camera Error: " + err.message;
      statusText.style.color = "#f44336";
      console.error(err);
    }
  }

  toggleCamBtn.onclick = () => {
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
    startCamera();
  };

        let hierarchy = new cv.Mat();
        cv.findContours(threshMat, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

        const minArea = (canvas.width * canvas.height) * 0.0008;
        const maxArea = (canvas.width * canvas.height) * 0.90;
        const processedCenters = [];

              for (let p of processedCenters) {

                  break;
                }
              }

              if (!duplicate) {
                let srcQuadPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
                  quadPts[0].x, quadPts[0].y,
                  quadPts[1].x, quadPts[1].y,
                  quadPts[2].x, quadPts[2].y,
                  quadPts[3].x, quadPts[3].y
                ]);

                let M = cv.getPerspectiveTransform(srcQuadPts, dstQuadPts);
                cv.warpPerspective(grayMat, warpedMat, M, new cv.Size(80, 80));

                let result = decodeWarpedAprilTag(warpedMat);
                if (result !== null) {
                  processedCenters.push({ x: cx, y: cy });

                  // Align 4 corner points according to the tag's true orientation
                  let r = result.rotation;
                  let trueCorners = [
                    quadPts[(0 + r) % 4],
                    quadPts[(1 + r) % 4],
                    quadPts[(2 + r) % 4],
                    quadPts[(3 + r) % 4]
                  ];

                  detectedTags.push({
                    id: result.id,
                    corners: trueCorners
                  });
                }

                srcQuadPts.delete();
                M.delete();
              }
            }
          }
          cnt.delete();
        }

        contours.delete();
        hierarchy.delete();

        // 3D Pose Estimation & Overlay Rendering
        solveAndDrawTags(detectedTags);
      }
    } catch (err) {
      console.error("Pipeline error:", err);
    } finally {
      requestAnimationFrame(processFrame);
    }
  }

  // Extracts 4 convex quadrilateral corners using multi-scale hull approximation
  function extractQuadCorners(cnt) {
    let hull = new cv.Mat();
    cv.convexHull(cnt, hull, false, true);
    let peri = cv.arcLength(hull, true);

    let approx = new cv.Mat();
    let bestQuad = null;

    // Search epsilon scale for 4-vertex polygon
    for (let epsFactor = 0.03; epsFactor <= 0.12; epsFactor += 0.015) {
      cv.approxPolyDP(hull, approx, epsFactor * peri, true);
      if (approx.rows === 4 && cv.isContourConvex(approx)) {
        let rawPts = [];
        for (let j = 0; j < 4; j++) {
          rawPts.push({ x: approx.data32S[j * 2], y: approx.data32S[j * 2 + 1] });
        }
        bestQuad = orderClockwise(rawPts);
        break;
      }
    }

    hull.delete();
    approx.delete();
    return bestQuad;
  }

  function orderClockwise(pts) {
    let cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4;
    let cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4;

    pts.sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));

    // Sort starting with top-left (minimum x + y)
    let minIdx = 0, minSum = pts[0].x + pts[0].y;
    for (let i = 1; i < 4; i++) {
      let sum = pts[i].x + pts[i].y;
      if (sum < minSum) {
        minSum = sum;
        minIdx = i;
      }
    }

    return [
      pts[minIdx],
      pts[(minIdx + 1) % 4],
      pts[(minIdx + 2) % 4],
      pts[(minIdx + 3) % 4]
    ];
  }

  // Decodes 8x8 AprilTag grid (1-cell border + 6x6 interior)
  function decodeWarpedAprilTag(mat) {
    const grid = [];
    let borderSum = 0, borderCount = 0;
    const interiorVals = [];

    for (let r = 0; r < 8; r++) {
      grid[r] = [];
      for (let c = 0; c < 8; c++) {
        let sum = 0;
        // Sample center 4x4 sub-region of each 10x10 cell
        for (let y = r * 10 + 3; y < r * 10 + 7; y++) {
          for (let x = c * 10 + 3; x < c * 10 + 7; x++) {
            sum += mat.data[y * 80 + x];
          }
        }
        let avg = sum / 16.0;
        grid[r][c] = avg;

        if (r === 0 || r === 7 || c === 0 || c === 7) {
          borderSum += avg;
          borderCount++;
        } else {
          interiorVals.push(avg);
        }
      }
    }

    const borderAvg = borderSum / borderCount;
    const maxInt = Math.max(...interiorVals);
    const minInt = Math.min(...interiorVals);

    // Validate dark border presence and contrast
    if ((maxInt - borderAvg) < 25 || (maxInt - minInt) < 30) {
      return null;
    }

    const threshold = (borderAvg + maxInt) / 2.0;
    const payload = [];
    for (let r = 1; r <= 6; r++) {
      payload[r - 1] = [];
      for (let c = 1; c <= 6; c++) {
        payload[r - 1][c - 1] = grid[r][c] > threshold ? 1 : 0;
      }
    }

    // Evaluate all 4 rotations (0°, 90°, 180°, 270°)
    for (let rot = 0; rot < 4; rot++) {
      let code = 0n;
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          let bit = 0;
          if (rot === 0) bit = payload[r][c];
          else if (rot === 1) bit = payload[5 - c][r];
          else if (rot === 2) bit = payload[5 - r][5 - c];
          else if (rot === 3) bit = payload[c][5 - r];

          code = (code << 1n) | BigInt(bit);
        }
      }

      if (codebookMap.has(code)) {
        return { id: codebookMap.get(code), rotation: rot };
      }
    }

    return null;
  }

  // 3D SolvePnP, Metric Pose & Coordinate Frame Rendering
  function solveAndDrawTags(tags) {
    if (tags.length === 0) {
      telemetryEl.innerHTML = '<i>Searching for AprilTag 36h11...</i>';
      return;
    }

    const tagSizeMeters = (parseFloat(tagSizeInput.value) || 100) / 1000.0;
    const s = tagSizeMeters;

    // Real-world 3D coordinates in tag frame
    const objPoints = cv.matFromArray(4, 3, cv.CV_32F, [
      -s/2, -s/2, 0,
       s/2, -s/2, 0,
       s/2,  s/2, 0,
      -s/2,  s/2, 0
    ]);

    let telemetryHtml = '';

    tags.forEach(tag => {
      const c = tag.corners;
      const imgPoints = cv.matFromArray(4, 2, cv.CV_32F, [
        c[0].x, c[0].y,
        c[1].x, c[1].y,
        c[2].x, c[2].y,
        c[3].x, c[3].y
      ]);

      let rvec = new cv.Mat();
      let tvec = new cv.Mat();
      cv.solvePnP(objPoints, imgPoints, cameraMatrix, distCoeffs, rvec, tvec);

      let R = new cv.Mat();
      cv.Rodrigues(rvec, R);

      const euler = rotationMatrixToEuler(R.data64F);
      const tx = tvec.data64F[0];
      const ty = tvec.data64F[1];
      const tz = tvec.data64F[2];
      const distance = Math.hypot(tx, ty, tz);

      const centerX = (c[0].x + c[1].x + c[2].x + c[3].x) / 4;
      const centerY = (c[0].y + c[1].y + c[2].y + c[3].y) / 4;

      // Draw green boundary polygon & corner dot
      drawTagOutline(c);

      // Project & Draw 3D XYZ coordinate axes
      draw3DAxes(rvec, tvec, s * 0.75);

      // Floating label above tag
      drawOnScreenLabels(centerX, centerY, tag.id, euler, distance);

      telemetryHtml += `
        <div class="tag-block">
          <b style="color: #00e676;">Tag ID #${tag.id}</b>
          <div class="value-row"><span>Pitch (X):</span> <span>${euler.pitch}°</span></div>
          <div class="value-row"><span>Yaw &nbsp;&nbsp;(Y):</span> <span>${euler.yaw}°</span></div>
          <div class="value-row"><span>Roll &nbsp;(Z):</span> <span>${euler.roll}°</span></div>
          <div class="value-row"><span>XYZ (m)&nbsp;:</span> <span>[${tx.toFixed(2)}, ${ty.toFixed(2)}, ${tz.toFixed(2)}]</span></div>
          <div class="value-row"><span>Distance:</span> <span>${distance.toFixed(2)} m</span></div>
        </div>
      `;

      imgPoints.delete();
      rvec.delete();
      tvec.delete();
      R.delete();
    });

    objPoints.delete();
    telemetryEl.innerHTML = telemetryHtml;
  }

  function rotationMatrixToEuler(R) {
    const r00 = R[0], r01 = R[1], r02 = R[2];
    const r10 = R[3], r11 = R[4], r12 = R[5];
    const r20 = R[6], r21 = R[7], r22 = R[8];

    let pitch, yaw, roll;
    const sy = Math.sqrt(r00 * r00 + r10 * r10);
    const singular = sy < 1e-6;

    if (!singular) {
      pitch = Math.atan2(r21, r22);
      yaw   = Math.atan2(-r20, sy);
      roll  = Math.atan2(r10, r00);
    } else {
      pitch = Math.atan2(-r12, r11);
      yaw   = Math.atan2(-r20, sy);
      roll  = 0;
    }

    const rad2deg = 180 / Math.PI;
    return {
      pitch: (pitch * rad2deg).toFixed(1),
      yaw:   (yaw * rad2deg).toFixed(1),
      roll:  (roll * rad2deg).toFixed(1)
    };
  }

  function drawTagOutline(c) {
    ctx.beginPath();
    ctx.moveTo(c[0].x, c[0].y);
    ctx.lineTo(c[1].x, c[1].y);
    ctx.lineTo(c[2].x, c[2].y);
    ctx.lineTo(c[3].x, c[3].y);
    ctx.closePath();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#00e676';
    ctx.stroke();

    // Red dot indicating top-left corner (Corner 0)
    ctx.beginPath();
    ctx.arc(c[0].x, c[0].y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#ff1744';
    ctx.fill();
  }

  function draw3DAxes(rvec, tvec, length) {
    const axisPoints3D = cv.matFromArray(4, 3, cv.CV_32F, [
      0, 0, 0,
      length, 0, 0,
      0, length, 0,
      0, 0, -length
    ]);

    let imagePoints = new cv.Mat();
    cv.projectPoints(axisPoints3D, rvec, tvec, cameraMatrix, distCoeffs, imagePoints);
    const pts = imagePoints.data32F;

    const originX = pts[0], originY = pts[1];
    drawLine(originX, originY, pts[2], pts[3], '#ff1744', 4); // X-Axis (Red)
    drawLine(originX, originY, pts[4], pts[5], '#00e676', 4); // Y-Axis (Green)
    drawLine(originX, originY, pts[6], pts[7], '#2979ff', 4); // Z-Axis (Blue)

    axisPoints3D.delete();
    imagePoints.delete();
  }

  function drawLine(x1, y1, x2, y2, color, width) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  function drawOnScreenLabels(x, y, id, euler, dist) {
    ctx.save();
    ctx.font = 'bold 13px monospace';
    ctx.shadowColor = 'black';
    ctx.shadowBlur = 4;

    const lines = [
      `ID #${id}`,
      `P: ${euler.pitch}°`,
      `Y: ${euler.yaw}°`,
      `R: ${euler.roll}°`,
      `D: ${dist.toFixed(2)}m`
    ];

    lines.forEach((line, idx) => {
      ctx.fillStyle = idx === 0 ? '#00e676' : '#ffffff';
      ctx.fillText(line, x + 15, y - 25 + idx * 16);
    });

    ctx.restore();
  }
</script>
</body>
</html>
