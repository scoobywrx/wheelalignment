<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AprilTag Wheel Alignment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      background: #000;
      color: #fff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #container {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video { display: none; }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hud {
      position: absolute;
      top: max(10px, env(safe-area-inset-top, 10px));
      left: 10px;
      right: 10px;
      background: rgba(14, 14, 14, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.35;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }
    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .hud h1 {
      font-size: 13px;
      color: #00e676;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge {
      display: inline-block;
      padding: 2px 6px;
      background: #ff5252;
      color: #fff;
      font-weight: bold;
      font-size: 10px;
      border-radius: 4px;
    }
    .badge.active {
      background: #00e676;
      color: #111;
    }
    .controls-panel {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom, 12px));
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 20px);
      max-width: 420px;
      background: rgba(14, 14, 14, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 10px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    }
    .ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .ctrl-row label {
      font-size: 11px;
      color: #ccc;
    }
    .ctrl-row input, .ctrl-row select {
      padding: 4px 6px;
      background: #222;
      border: 1px solid #555;
      color: #fff;
      border-radius: 4px;
      font-size: 12px;
    }
    .ctrl-row input {
      width: 52px;
      text-align: center;
    }
    .ctrl-row select {
      flex: 1;
    }
    .btn {
      flex: 1;
      background: #00e676;
      border: none;
      color: #111;
      padding: 8px 6px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
    }
    .btn-sensor { background: #ff9100; color: #111; }
    .btn-tare { background: #ffca28; color: #111; }
    .btn-cam { background: #444; color: #fff; flex: 0.5; }
    .value-row {
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      margin: 2px 0;
    }
    .value-highlight {
      font-weight: bold;
      color: #00e676;
      font-size: 14px;
    }
    .tag-block {
      margin-top: 4px;
      padding: 5px 8px;
      background: rgba(255, 255, 255, 0.07);
      border-left: 3px solid #00e676;
      border-radius: 4px;
    }
    #fpsCounter {
      font-size: 10px;
      color: #888;
      font-family: monospace;
    }
  </style>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onOpenCvReady()"></script>
</head>
<body>

<div id="container">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="outputCanvas"></canvas>

  <div class="hud">
    <div class="hud-header">
      <h1>AprilTag Wheel Alignment</h1>
      <span id="imuStatus" class="badge">Gravity: Inactive</span>
    </div>
    <div style="display: flex; justify-content: space-between;">
      <span>Status: <span id="status" style="font-weight: bold; color: #fbc02d;">Loading WASM...</span></span>
      <span id="fpsCounter">FPS: --</span>
    </div>
    <div id="telemetry" style="margin-top: 4px; border-top: 1px solid #333; padding-top: 4px;">
      <i>Starting camera...</i>
    </div>
  </div>

  <div class="controls-panel">
    <div class="ctrl-row">
      <label for="lensProfile">Lens:</label>
      <select id="lensProfile">
        <option value="0.650" selected>iPhone Pro 14/15/16 (24mm)</option>
        <option value="0.740">iPhone Standard / Older (26mm)</option>
      </select>
      <button id="toggleCamera" class="btn btn-cam">Cam 🔄</button>
    </div>
    <div class="ctrl-row">
      <label for="tagSize">Tag Size:</label>
      <input type="number" id="tagSize" value="95" min="10" max="500" step="1">
      <span style="font-size: 11px; color:#888;">mm</span>
      <button id="sensorBtn" class="btn btn-sensor">Enable Gravity 🔒</button>
      <button id="tareBtn" class="btn btn-tare">Tare (Zero)</button>
    </div>
  </div>
</div>

    if (cameraMatrix) cameraMatrix.delete();
    if (distCoeffs) distCoeffs.delete();
    if (imgPoints) imgPoints.delete();
    if (rvec) rvec.delete();
    if (tvec) tvec.delete();
    if (R_mat) R_mat.delete();
    if (axisPoints3D) axisPoints3D.delete();
    if (projectedAxisPts) projectedAxisPts.delete();
    if (contours) contours.delete();
    if (hierarchy) hierarchy.delete();

    srcMat = new cv.Mat(h, w, cv.CV_8UC4);
    grayMat = new cv.Mat(h, w, cv.CV_8UC1);
    threshMat = new cv.Mat(h, w, cv.CV_8UC1);
    warpedMat = new cv.Mat(80, 80, cv.CV_8UC1);

    dstQuadPts = cv.matFromArray(4, 1, cv.CV_32FC2, [
      0, 0,
      79, 0,
      79, 79,
      0, 79
    ]);
    srcQuadPts = new cv.Mat(4, 1, cv.CV_32FC2);
    imgPoints = new cv.Mat(4, 1, cv.CV_32FC2);

    const maxDim = Math.max(w, h);
    const fx = maxDim * focalRatio;
    cameraMatrix = cv.matFromArray(3, 3, cv.CV_64F, [
      fx, 0, w / 2.0,
      0, fx, h / 2.0,
      0, 0, 1.0
    ]);
    distCoeffs = cv.matFromArray(4, 1, cv.CV_64F, [0, 0, 0, 0]);

    rvec = new cv.Mat(3, 1, cv.CV_64F);
    tvec = new cv.Mat(3, 1, cv.CV_64F);
    R_mat = new cv.Mat(3, 3, cv.CV_64F);

    contours = new cv.MatVector();
    hierarchy = new cv.Mat();

    try {
      subPixWinSize = new cv.Size(5, 5);
      subPixZeroZone = new cv.Size(-1, -1);
      // Bitmask: EPS (2) | COUNT (1) = 3
      subPixCriteria = new cv.TermCriteria(3, 30, 0.02);
    } catch (e) {
      subPixCriteria = null;
    }

    init3DObjectPoints();
  }

  function updateCameraMatrix() {
    if (!cameraMatrix || !canvas.width) return;
    const w = canvas.width;
    const h = canvas.height;
    const maxDim = Math.max(w, h);
    const fx = maxDim * focalRatio;
    cameraMatrix.data64F[0] = fx;
    cameraMatrix.data64F[2] = w / 2.0;
    cameraMatrix.data64F[4] = fx;
    cameraMatrix.data64F[5] = h / 2.0;
    tagFilterMap.clear();
  }

  function init3DObjectPoints() {
    if (objPoints) objPoints.delete();
    if (axisPoints3D) axisPoints3D.delete();

    const tagSizeMeters = (parseFloat(tagSizeInput.value) || 95) / 1000.0;
    const s = tagSizeMeters;
    const half = s / 2.0;

    objPoints = cv.matFromArray(4, 3, cv.CV_32F, [
      -half, -half, 0.0,
       half, -half, 0.0,
       half,  half, 0.0,
      -half,  half, 0.0
    ]);

    const axisLen = s * 0.75;
    axisPoints3D = cv.matFromArray(4, 3, cv.CV_32F, [
      0.0, 0.0, 0.0,
      axisLen, 0.0, 0.0,
      0.0, axisLen, 0.0,
      0.0, 0.0, -axisLen
    ]);
    projectedAxisPts = new cv.Mat();
  }

  sensorBtn.onclick = async () => {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        const res = await DeviceMotionEvent.requestPermission();
        if (res === 'granted') {
          attachMotionListeners();
        } else {
          alert('Motion sensor permission denied.');
        }
      } catch (err) {
        console.warn(err);
      }
    } else {
      attachMotionListeners();
    }
  };

  function attachMotionListeners() {
    window.addEventListener('devicemotion', (e) => {
      const acc = e.accelerationIncludingGravity;
      if (acc && acc.x !== null) {
        const rawGx = -acc.x;
        const rawGy = acc.y;
        const rawGz = acc.z;

        const alpha = 0.20;
        gCam[0] = gCam[0] * (1 - alpha) + rawGx * alpha;
        gCam[1] = gCam[1] * (1 - alpha) + rawGy * alpha;
        gCam[2] = gCam[2] * (1 - alpha) + rawGz * alpha;

        if (!isSensorActive) {
          isSensorActive = true;
          imuStatusEl.innerText = "Gravity: Locked 🔒";
          imuStatusEl.className = "badge active";
          sensorBtn.innerText = "Sensor Active ✅";
          sensorBtn.style.background = "#333";
          sensorBtn.style.color = "#fff";
        }
      }
    }, true);
  }

  function onOpenCvReady() {
    cv['onRuntimeInitialized'] = () => {
      openCvReady = true;
      statusText.innerText = "OpenCV Ready";
      statusText.style.color = "#29b6f6";
      startCamera();
    };
  }

  async function startCamera() {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });

      video.srcObject = stream;
      await new Promise((resolve) => {
        if (video.readyState >= 2) resolve();
        else video.onloadedmetadata = () => resolve();
      });
      await video.play();

      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      initOpenCVMats(canvas.width, canvas.height);

      statusText.innerText = "Tracking Active";
      statusText.style.color = "#00e676";

      if (!isLoopRunning) {
        isLoopRunning = true;
        requestAnimationFrame(processFrame);
      }
    } catch (err) {
      statusText.innerText = "Cam Error: " + err.message;
      statusText.style.color = "#f44336";
    }
  }

  toggleCamBtn.onclick = () => {
    currentFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';
    startCamera();
  };

  tareBtn.onclick = () => {
    if (tareOffsets.camber !== 0.0 || tareOffsets.toe !== 0.0) {
      tareOffsets = { camber: 0.0, toe: 0.0 };
      tareBtn.innerText = "Tare (Zero)";
      tareBtn.style.background = "#ffca28";
    } else {
      tareOffsets = { camber: lastRawAngles.camber, toe: lastRawAngles.toe };
      tareBtn.innerText = "Reset Tare ↺";
      tareBtn.style.background = "#fff";
    }
    tagFilterMap.clear();
  };

  function processFrame() {
    try {
      if (video.readyState >= 2 && openCvReady && srcMat) {
        frameCount++;
        const now = performance.now();
        if (now - lastFpsTime >= 1000) {
          fpsCounter.innerText = `FPS: ${frameCount}`;
          frameCount = 0;
          lastFpsTime = now;
        }

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        srcMat.data.set(imgData.data);

        // RGBA -> Grayscale
        cv.cvtColor(srcMat, grayMat, cv.COLOR_RGBA2GRAY, 0);

        // Robust Gaussian adaptive thresholding (window=25, C=7)
        cv.adaptiveThreshold(grayMat, threshMat, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY_INV, 25, 7);

        cv.findContours(threshMat, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);

        const detectedTags = [];
        const minArea = (canvas.width * canvas.height) * 0.0008;
        const maxArea = (canvas.width * canvas.height) * 0.90;
        const numContours = contours.size();
        const processedCenters = [];

        for (let i = 0; i < numContours; ++i) {
          const cnt = contours.get(i);
          const area = cv.contourArea(cnt);

          if (area > minArea && area < maxArea) {
            const peri = cv.arcLength(cnt, true);
            let approx = new cv.Mat();
            cv.approxPolyDP(cnt, approx, 0.035 * peri, true);

            if (approx.rows === 4 && cv.isContourConvex(approx)) {
              const rawPts = [
                { x: approx.data32S[0], y: approx.data32S[1] },
                { x: approx.data32S[2], y: approx.data32S[3] },
                { x: approx.data32S[4], y: approx.data32S[5] },
                { x: approx.data32S[6], y: approx.data32S[7] }
              ];
              const quadPts = orderClockwise(rawPts);
              const cx = (quadPts[0].x + quadPts[1].x + quadPts[2].x + quadPts[3].x) / 4.0;
              const cy = (quadPts[0].y + quadPts[1].y + quadPts[2].y + quadPts[3].y) / 4.0;

              let isDuplicate = false;
              for (const p of processedCenters) {
                if (Math.hypot(p.x - cx, p.y - cy) < 20) {
                  isDuplicate = true;
                  break;
                }
              }

              if (!isDuplicate) {
                const srcData = srcQuadPts.data32F;
                srcData[0] = quadPts[0].x; srcData[1] = quadPts[0].y;
                srcData[2] = quadPts[1].x; srcData[3] = quadPts[1].y;
                srcData[4] = quadPts[2].x; srcData[5] = quadPts[2].y;
                srcData[6] = quadPts[3].x; srcData[7] = quadPts[3].y;

                const M = cv.getPerspectiveTransform(srcQuadPts, dstQuadPts);
                cv.warpPerspective(grayMat, warpedMat, M, new cv.Size(80, 80));
                M.delete();

                const tagDecode = decodeWarpedAprilTag(warpedMat);
                if (tagDecode !== null) {
                  processedCenters.push({ x: cx, y: cy });
                  const r = tagDecode.rotation;

                  const trueCorners = [
                    { x: quadPts[(0 + r) % 4].x, y: quadPts[(0 + r) % 4].y },
                    { x: quadPts[(1 + r) % 4].x, y: quadPts[(1 + r) % 4].y },
                    { x: quadPts[(2 + r) % 4].x, y: quadPts[(2 + r) % 4].y },
                    { x: quadPts[(3 + r) % 4].x, y: quadPts[(3 + r) % 4].y }
                  ];

                  // Sub-pixel refinement with safe fallback
                  try {
                    if (subPixCriteria && subPixWinSize) {
                      const imgDataSubPix = imgPoints.data32F;
                      for (let k = 0; k < 4; k++) {
                        imgDataSubPix[k * 2] = trueCorners[k].x;
                        imgDataSubPix[k * 2 + 1] = trueCorners[k].y;
                      }
                      cv.cornerSubPix(grayMat, imgPoints, subPixWinSize, subPixZeroZone, subPixCriteria);
                      for (let k = 0; k < 4; k++) {
                        trueCorners[k].x = imgDataSubPix[k * 2];
                        trueCorners[k].y = imgDataSubPix[k * 2 + 1];
                      }
                    }
                  } catch (e) {
                    // Fallback directly to polygon corners
                  }

                  detectedTags.push({ id: tagDecode.id, corners: trueCorners });
                }
              }
            }
            approx.delete();
          }
          cnt.delete();
        }

        solveAndDrawTags(detectedTags);
      }
    } catch (err) {
      console.error("Pipeline error:", err);
    } finally {
      requestAnimationFrame(processFrame);
    }
  }

  function orderClockwise(pts) {
    const cx = (pts[0].x + pts[1].x + pts[2].x + pts[3].x) / 4.0;
    const cy = (pts[0].y + pts[1].y + pts[2].y + pts[3].y) / 4.0;

    pts.sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));

    let minIdx = 0, minSum = pts[0].x + pts[0].y;
    for (let i = 1; i < 4; i++) {
      const sum = pts[i].x + pts[i].y;
      if (sum < minSum) {
        minSum = sum;
        minIdx = i;
      }
    }

    return [
      pts[minIdx],
      pts[(minIdx + 1) % 4],
      pts[(minIdx + 2) % 4],
      pts[(minIdx + 3) % 4]
    ];
  }

  function decodeWarpedAprilTag(mat) {
    const grid = [];
    let borderSum = 0, borderCount = 0;
    const interiorVals = [];

    const data = mat.data;
    for (let r = 0; r < 8; r++) {
      grid[r] = [];
      for (let c = 0; c < 8; c++) {
        let sum = 0;
        const startY = r * 10 + 3;
        const startX = c * 10 + 3;
        for (let y = startY; y < startY + 4; y++) {
          const rowOffset = y * 80;
          for (let x = startX; x < startX + 4; x++) {
            sum += data[rowOffset + x];
          }
        }
        const avg = sum / 16.0;
        grid[r][c] = avg;

        if (r === 0 || r === 7 || c === 0 || c === 7) {
          borderSum += avg;
          borderCount++;
        } else {
          interiorVals.push(avg);
        }
      }
    }

    const borderAvg = borderSum / borderCount;
    let maxInt = -1, minInt = 256;
    for (let i = 0; i < interiorVals.length; i++) {
      if (interiorVals[i] > maxInt) maxInt = interiorVals[i];
      if (interiorVals[i] < minInt) minInt = interiorVals[i];
    }

    if ((maxInt - borderAvg) < 25 || (maxInt - minInt) < 30) {
      return null;
    }

    const threshold = (borderAvg + maxInt) / 2.0;
    const payload = [];
    for (let r = 1; r <= 6; r++) {
      payload[r - 1] = [];
      for (let c = 1; c <= 6; c++) {
        payload[r - 1][c - 1] = grid[r][c] > threshold ? 1 : 0;
      }
    }

    for (let rot = 0; rot < 4; rot++) {
      let code = 0n;
      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 6; c++) {
          let bit = 0;
          if (rot === 0) bit = payload[r][c];
          else if (rot === 1) bit = payload[c][5 - r];
          else if (rot === 2) bit = payload[5 - r][5 - c];
          else if (rot === 3) bit = payload[5 - c][r];

          code = (code << 1n) | BigInt(bit);
        }
      }

      if (codebookMap.has(code)) {
        return { id: codebookMap.get(code), rotation: rot };
      }
    }

    return null;
  }

  function computeGravityLockedAngles(R) {
    const rad2deg = 180.0 / Math.PI;

    const gLen = Math.hypot(gCam[0], gCam[1], gCam[2]) || 1.0;
    const gx = gCam[0] / gLen, gy = gCam[1] / gLen, gz = gCam[2] / gLen;

    const nx = R[2], ny = R[5], nz = R[8];

    // True Camber = Angle between Tag Normal and True Vertical Gravity Vector
    const dotNG = nx * gx + ny * gy + nz * gz;
    const rawCamber = -Math.asin(Math.max(-1.0, Math.min(1.0, dotNG))) * rad2deg;

    // True Toe = Horizontal angle relative to optical axis
    const rawToe = Math.atan2(nx, nz) * rad2deg;

    lastRawAngles.camber = rawCamber;
    lastRawAngles.toe = rawToe;

    const taredCamber = rawCamber - tareOffsets.camber;
    const taredToe = rawToe - tareOffsets.toe;

    return { rawCamber: taredCamber, rawToe: taredToe };
  }

  function filterAngles(tagId, rawCamber, rawToe, rawDist) {
    if (!tagFilterMap.has(tagId)) {
      tagFilterMap.set(tagId, { camber: rawCamber, toe: rawToe, dist: rawDist });
    }

    const state = tagFilterMap.get(tagId);
    const alpha = 0.35;

    state.camber = state.camber * (1 - alpha) + rawCamber * alpha;
    state.toe = state.toe * (1 - alpha) + rawToe * alpha;
    state.dist = state.dist * (1 - alpha) + rawDist * alpha;

    return {
      camber: state.camber.toFixed(1),
      toe: state.toe.toFixed(1),
      dist: state.dist.toFixed(3)
    };
  }

  function solveAndDrawTags(tags) {
    if (tags.length === 0) {
      telemetryEl.innerHTML = '<i>Searching for AprilTag 36h11 (95mm)...</i>';
      return;
    }

    let telemetryHtml = '';
    const solvedTags = [];

    tags.forEach(tag => {
      const c = tag.corners;
      const imgData = imgPoints.data32F;
      imgData[0] = c[0].x; imgData[1] = c[0].y;
      imgData[2] = c[1].x; imgData[3] = c[1].y;
      imgData[4] = c[2].x; imgData[5] = c[2].y;
      imgData[6] = c[3].x; imgData[7] = c[3].y;

      cv.solvePnP(objPoints, imgPoints, cameraMatrix, distCoeffs, rvec, tvec, false, cv.SOLVEPNP_ITERATIVE);
      cv.Rodrigues(rvec, R_mat);

      const tx = tvec.data64F[0], ty = tvec.data64F[1], tz = tvec.data64F[2];
      const rawDist = Math.hypot(tx, ty, tz);

      const rawAngles = computeGravityLockedAngles(R_mat.data64F);
      const filtered = filterAngles(tag.id, rawAngles.rawCamber, rawAngles.rawToe, rawDist);

      const centerX = (c[0].x + c[1].x + c[2].x + c[3].x) / 4.0;
      const centerY = (c[0].y + c[1].y + c[2].y + c[3].y) / 4.0;

      drawTagOutline(c);
      draw3DAxes(rvec, tvec);
      drawOnScreenLabels(centerX, centerY, tag.id, filtered);

      solvedTags.push({ id: tag.id, R_data: [...R_mat.data64F], filtered });

      telemetryHtml += `
        <div class="tag-block">
          <b style="color: #00e676;">Tag ID #${tag.id} (95mm)</b>
          <div class="value-row"><span>True Camber (Vertical):</span> <span class="value-highlight">${filtered.camber}°</span></div>
          <div class="value-row"><span>True Toe (Steer) &nbsp;&nbsp;&nbsp;:</span> <span class="value-highlight">${filtered.toe}°</span></div>
          <div class="value-row"><span>Physical Distance &nbsp;&nbsp;:</span> <span>${filtered.dist} m</span></div>
        </div>
      `;
    });

    // Dual-Tag Differential Mode (Tag 0 vs Wheel Tag)
    if (solvedTags.length >= 2) {
      const refTag = solvedTags.find(t => t.id === 0) || solvedTags[0];
      const wheelTag = solvedTags.find(t => t.id !== refTag.id);

      const R_ref = refTag.R_data;
      const R_wh = wheelTag.R_data;

      // R_rel = R_ref^T * R_wh
      const R_rel = new Array(9);
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          R_rel[r*3 + c] = R_ref[0*3 + r] * R_wh[0*3 + c] +
                           R_ref[1*3 + r] * R_wh[1*3 + c] +
                           R_ref[2*3 + r] * R_wh[2*3 + c];
        }
      }

      const relCamber = (Math.atan2(-R_rel[1*3 + 2], R_rel[2*3 + 2]) * (180.0 / Math.PI)).toFixed(1);
      const relToe = (Math.atan2(R_rel[0*3 + 2], R_rel[2*3 + 2]) * (180.0 / Math.PI)).toFixed(1);

      telemetryHtml = `
        <div class="tag-block" style="border-left-color: #ffca28; background: rgba(255,202,40,0.12);">
          <b style="color: #ffca28;">Dual-Tag Differential (Wheel vs Ref)</b>
          <div class="value-row"><span>Rel Camber (Tag #${wheelTag.id} vs #${refTag.id}):</span> <span class="value-highlight" style="color:#ffca28;">${relCamber}°</span></div>
          <div class="value-row"><span>Rel Toe &nbsp; &nbsp; (Tag #${wheelTag.id} vs #${refTag.id}):</span> <span class="value-highlight" style="color:#ffca28;">${relToe}°</span></div>
        </div>
      ` + telemetryHtml;
    }

    telemetryEl.innerHTML = telemetryHtml;
  }

  function drawTagOutline(c) {
    ctx.beginPath();
    ctx.moveTo(c[0].x, c[0].y);
    ctx.lineTo(c[1].x, c[1].y);
    ctx.lineTo(c[2].x, c[2].y);
    ctx.lineTo(c[3].x, c[3].y);
    ctx.closePath();
    ctx.lineWidth = 3;
    ctx.strokeStyle = '#00e676';
    ctx.stroke();

    // Top-Left origin anchor (Red Dot)
    ctx.beginPath();
    ctx.arc(c[0].x, c[0].y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#ff1744';
    ctx.fill();
  }

  function draw3DAxes(rvec, tvec) {
    cv.projectPoints(axisPoints3D, rvec, tvec, cameraMatrix, distCoeffs, projectedAxisPts);
    const pts = projectedAxisPts.data32F;

    const ox = pts[0], oy = pts[1];
    drawLine(ox, oy, pts[2], pts[3], '#ff1744', 4); // X (Red)
    drawLine(ox, oy, pts[4], pts[5], '#00e676', 4); // Y (Green)
    drawLine(ox, oy, pts[6], pts[7], '#2979ff', 4); // Z (Blue)
  }

  function drawLine(x1, y1, x2, y2, color, width) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.lineWidth = width;
    ctx.strokeStyle = color;
    ctx.stroke();
  }

  function drawOnScreenLabels(x, y, id, f) {
    ctx.save();
    ctx.font = 'bold 13px ui-monospace, monospace';
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 4;

    const lines = [
      `ID #${id}`,
      `Camber: ${f.camber}°`,
      `Toe   : ${f.toe}°`,
      `Dist  : ${f.dist}m`
    ];

    lines.forEach((line, idx) => {
      ctx.fillStyle = idx === 0 ? '#ffca28' : (idx < 3 ? '#00e676' : '#ffffff');
      ctx.fillText(line, x + 12, y - 20 + idx * 16);
    });

    ctx.restore();
  }
</script>
</body>
</html>
